<section class="flex items-center justify-center min-h-screen bg-gray-50">
  <div class="w-full max-w-sm bg-white rounded-xl shadow-lg"> 
    <div class="p-8 space-y-6"> 
    
      <h1 class="text-2xl font-bold leading-tight tracking-tight text-gray-900">
        Sign in to your account
      </h1>
      
      <div>
        <label for="email" class="block mb-2 text-base font-medium text-gray-700">Your email</label>
        <input 
          type="email" 
          [(ngModel)]="email"
          id="email"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 ease-in-out"
          placeholder="name@company.com" 
          required
        />
      </div>
      
      <div>
        <label for="password" class="block mb-2 text-base font-medium text-gray-700">Password</label>
        <input 
          type="password" 
          [(ngModel)]="password" 
          id="password"
          placeholder="••••••••"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 ease-in-out"
          required
        />
      </div>

      @if(errorMessage){
        <div class="p-3 text-sm font-medium text-red-700 bg-red-100 border border-red-200 rounded-lg">
          {{errorMessage}}
        </div>
      }

      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <input 
            id="remember" 
            aria-describedby="remember" 
            type="checkbox"
            class="w-4 h-4 border border-gray-300 rounded text-indigo-600 focus:ring-indigo-500"
          />
          <label for="remember" class="ml-2 text-sm text-gray-700 select-none">
            Remember me
          </label>
        </div>
        <a href="#" class="text-sm font-semibold text-indigo-600 hover:text-indigo-700 hover:underline">
          Forgot password?
        </a>
      </div>

      <button 
        (click)="onLogin()"
        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-lg font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out"
      >
        Sign in
      </button>

      <p class="text-base text-gray-700 text-center">
        Don’t have an account yet? 
        <a href="#" class="font-semibold text-indigo-600 hover:text-indigo-700 hover:underline">
          Sign up
        </a>
      </p>

    </div>
  </div>
</section>
