<section class="flex items-center justify-center min-h-screen bg-gray-50">
  <div class="w-full max-w-sm bg-white rounded-xl shadow-lg"> 
    <div class="p-8 space-y-6"> 
  <h2 class="text-3xl font-bold leading-tight tracking-tight text-gray-900">Dashboard</h2>

  <h4 class="text-xl  font-bold text-base text-gray-700 text-center">Edit Profile</h4>
  <p class="text-base text-gray-700 text-center">Name : {{user?.name}}</p>
  <p class="text-base text-gray-700 text-center">Email : {{user?.email}}</p>
  <p class="text-base text-gray-700 text-center">Role : {{user?.role}}</p>

  <button (click)="onLogout()" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-lg font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">Logout</button>

    </div>
  </div>
</section>
